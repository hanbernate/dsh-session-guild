name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance (sigstore attestation)

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The tag is the release identity: a mismatch must not publish.
      - name: Verify the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "publishing $version"

      - name: Check and test
        run: |
          npm run check
          npm test

      # The dist-tag defaults to beta, so an accidental tag cannot replace
      # `latest` while the package is a public beta. For a stable release set
      # the repository variable NPM_DIST_TAG=latest (Settings -> Variables).
      - name: Publish to npm
        run: npm publish --tag "${NPM_DIST_TAG:-beta}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ vars.NPM_DIST_TAG }}
